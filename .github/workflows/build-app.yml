name: build-app

# Build app Flutter jadi APK Android, exe Windows, dan versi web setiap ada
# perubahan di folder flutter_app. Versi web langsung di-deploy ke GitHub
# Pages. Bisa juga dijalankan manual dari tab Actions.
on:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

# Versi Flutter di-pin, supaya build nggak tiba-tiba gagal karena rilis
# stable baru. Naikkan versinya dengan sengaja, bukan otomatis.
env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Folder platform (android/) dibikin otomatis di sini, jadi repo
      # cukup berisi kode Dart-nya saja.
      - run: flutter create --project-name tebak_angka --org com.zuyss --platforms=android .
      # flutter create ikut bikin test contoh (widget_test.dart) yang
      # manggil class MyApp, padahal app kita namanya TebakAngkaApp.
      - run: rm -f test/widget_test.dart
      # Nama yang tampil di bawah ikon app (bawaannya nama proyek: tebak_angka).
      - run: |
          sed -i 's/android:label="tebak_angka"/android:label="Tebak Angka"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="Tebak Angka"' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v5
        with:
          name: tebak-angka-android
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter create --project-name tebak_angka --org com.zuyss --platforms=windows .
      # Judul jendela (bawaannya nama proyek: tebak_angka).
      - run: |
          sed -i 's/L"tebak_angka"/L"Tebak Angka"/' windows/runner/main.cpp
          grep -q 'L"Tebak Angka"' windows/runner/main.cpp
      - run: flutter pub get
      - run: flutter build windows --release
      # Isi folder Release ini (exe + dll + folder data) harus dibawa
      # bareng-bareng, exe-nya nggak bisa jalan sendirian.
      - uses: actions/upload-artifact@v5
        with:
          name: tebak-angka-windows
          path: flutter_app/build/windows/x64/runner/Release
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter create --project-name tebak_angka --org com.zuyss --platforms=web .
      # Judul tab browser dan nama saat dipasang ke layar utama HP.
      - run: |
          sed -i 's/<title>tebak_angka</<title>Tebak Angka</; s/content="tebak_angka"/content="Tebak Angka"/' web/index.html
          sed -i 's/"name": "tebak_angka"/"name": "Tebak Angka"/; s/"short_name": "tebak_angka"/"short_name": "Tebak Angka"/' web/manifest.json
          grep -q '<title>Tebak Angka</title>' web/index.html
      - run: flutter pub get
      # GitHub Pages menaruh situs di /<nama-repo>/, bukan di root domain.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: flutter_app/build/web

  deploy-web:
    # Hanya deploy dari branch main.
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Kalau ada dua push beruntun, deploy yang lama dibatalkan.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
